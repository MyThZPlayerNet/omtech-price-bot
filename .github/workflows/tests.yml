name: Testy projektu
on:
  push:
    paths:
      - '**.py'
      - config.json
      - '.github/workflows/**'
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Kontrolny odczyt OMTech z serwera GitHub (bez sekretów i zapisu)
        if: github.event_name == 'push'
        continue-on-error: true
        run: python monitor.py --mode fetch
